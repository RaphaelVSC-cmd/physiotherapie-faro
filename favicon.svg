<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="physioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0d8a7d" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f1c" />
      <stop offset="100%" stop-color="#142c27" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0d8a7d" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Geometric Biomechanical Icon: Dynamic Kinetic Waves & Spinal Arc -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#physioGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fluid Primary Spine / Arc (letter F + kinetic curve) -->
    <path d="M22 48 V16 C22 16 32 12 42 16 C48 18.5 48 24 42 26 C36 28 26 28 26 28" stroke-width="4.5" />
    <!-- Secondary Dynamic Kinetic Motion Stroke -->
    <path d="M25 36 C29 36 37 36 44 33" stroke-width="4" />
    <!-- Pulse Center Node (Point of Balance & Movement) -->
    <circle cx="44" cy="21" r="3" fill="#38bdf8" stroke="none" />
    <!-- Grounding Recovery Arc -->
    <path d="M16 48 C24 53 38 52 48 45" stroke-width="3.5" stroke-opacity="0.85" />
  </g>
</svg>
